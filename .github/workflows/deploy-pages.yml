name: Deploy PWA to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "12.5.1"
  NODE_VERSION: "22"
  TZ: "UTC"

jobs:
  build-and-deploy:
    name: Build & Deploy PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web PWA
        run: pnpm build:web

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextdo-pwa-dist
          path: apps/mobile/dist
          retention-days: 7

      - name: Deploy to Cloudflare Pages (via Wrangler Action)
        if: env.HAS_CF_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/mobile/dist --project-name=nextdo-pwa --branch=main
        env:
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}

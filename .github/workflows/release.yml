# Nextdo desktop release pipeline.
#
# Triggered by pushing a version tag (v*) or manually via workflow_dispatch.
# Builds the Tauri desktop app on macOS / Windows / Linux (each CI job
# rebuilds the @nextdo/mobile web export via the tauri.conf.json
# beforeBuildCommand) and publishes one GitHub Release containing the
# installers for all three platforms.
#
# Android is built via EAS (build-android, one release .apk per CPU ABI).
# iOS is NOT part of this pipeline — it needs Apple signing credentials and
# is produced separately.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"
      run_id:
        description: "Existing run whose artifacts should be republished. Leave empty (together with build_targets) to build fresh in this run."
        required: false
        default: ""
      build_targets:
        description: "Comma list of platforms to build now (macos,windows,linux,android). Empty = only republish the artifacts of run_id."
        required: false
        default: ""
      macos_archs:
        description: "macOS CPU targets: aarch64, x86_64, or both (comma list). aarch64 alone = Apple Silicon only."
        required: false
        default: "aarch64,x86_64"
      android_abis:
        description: "Comma list of Android ABIs to build (arm64-v8a,armeabi-v7a,x86,x86_64). Empty = all four."
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  PNPM_VERSION: "12.5.1"
  NODE_VERSION: "22"

jobs:
  build-macos:
    name: Build macOS
    # A tag push builds every platform. A manual dispatch builds only the
    # platforms listed in build_targets (macos-only is the common case: a
    # smoke-test release before spending EAS minutes on Android).
    if: >-
      github.event_name == 'push' ||
      contains(format(',{0},', inputs.build_targets), ',macos,')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build app bundle (arm64)
        if: contains(format(',{0},', inputs.macos_archs || 'aarch64,x86_64'), ',aarch64,')
        run: pnpm --filter @nextdo/desktop exec tauri build --bundles app
      - name: Build app bundle (x64)
        if: contains(format(',{0},', inputs.macos_archs || 'aarch64,x86_64'), ',x86_64,')
        run: |
          rustup target add x86_64-apple-darwin
          pnpm --filter @nextdo/desktop exec tauri build --bundles app --target x86_64-apple-darwin
      # Tauri's bundled create-dmg script uses the legacy `hdiutil create
      # -srcfolder` API which is broken on recent macOS (fails with
      # "no space left on device"). Build the installer with diskutil
      # instead — a plain (non-pretty) but fully functional dmg.
      - name: Package dmgs
        env:
          MACOS_ARCHS: ${{ inputs.macos_archs || 'aarch64,x86_64' }}
        run: |
          VER="$(node -p "require('./apps/desktop/package.json').version")"
          package_dmg() {
            local OUT="$1" ARCH="$2" STAGE
            mkdir -p "$OUT/dmg"
            STAGE="$(mktemp -d)"
            cp -R "$OUT/macos/Nextdo.app" "$STAGE/"
            ln -s /Applications "$STAGE/Applications"
            diskutil image create from "$STAGE" --volumeName Nextdo \
              --format UDZO "$OUT/dmg/Nextdo_${VER}_${ARCH}.dmg"
            rm -rf "$STAGE"
          }
          # Only package the arches this run actually built — asking for a
          # bundle the job skipped would fail the upload step.
          case ",$MACOS_ARCHS," in
            *,aarch64,*)  package_dmg "apps/desktop/src-tauri/target/release/bundle" aarch64 ;;
          esac
          case ",$MACOS_ARCHS," in
            *,x86_64,*)   package_dmg "apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle" x64 ;;
          esac
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows
    if: >-
      github.event_name == 'push' ||
      contains(format(',{0},', inputs.build_targets), ',windows,')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Windows installer
        shell: bash
        run: |
          # WiX MSI requires purely numeric versions. For prereleases (e.g. -beta.X),
          # only build the NSIS installer (.exe). For stable releases, build both NSIS and MSI.
          VER="$(node -p "require('./apps/desktop/package.json').version")"
          if [[ "$VER" == *-* ]]; then
            echo "Pre-release version $VER detected: building NSIS only"
            pnpm --filter @nextdo/desktop exec tauri build --bundles nsis
          else
            echo "Stable version $VER detected: building NSIS and MSI"
            pnpm --filter @nextdo/desktop exec tauri build --bundles nsis,msi
          fi
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

  build-linux:
    name: Build Linux
    if: >-
      github.event_name == 'push' ||
      contains(format(',{0},', inputs.build_targets), ',linux,')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build (appimage + deb)
        run: pnpm --filter @nextdo/desktop exec tauri build --bundles appimage,deb
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  build-android:
    name: Build Android (EAS, ${{ matrix.abi }})
    # Tag push builds every platform; a manual dispatch builds Android only
    # when build_targets asks for it. This job is the expensive one (one
    # cloud build per ABI), so it stays opt-in on manual runs. Within
    # Android, requested ABIs are filtered at the STEP level (ABI_SELECTED
    # below) — the matrix context is not available in a job-level if, and
    # an EAS build per skipped ABI is pure queue time. A leg whose ABI was
    # not requested skips all steps and reports success without an
    # artifact; the release job only uploads what exists.
    if: >-
      github.event_name == 'push' ||
      contains(format(',{0},', inputs.build_targets), ',android,')
    runs-on: ubuntu-latest
    # One EAS release build per CPU ABI (profiles in apps/mobile/eas.json).
    # Each leg emits a single-ABI .apk so a user downloads only the libs their
    # device needs, instead of one fat multi-ABI bundle.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { abi: arm64-v8a,   profile: android-arm64-v8a }
          - { abi: armeabi-v7a, profile: android-armeabi-v7a }
          - { abi: x86,         profile: android-x86 }
          - { abi: x86_64,      profile: android-x86-64 }
    env:
      # Empty android_abis (or a push event, where inputs are absent) means
      # build every ABI. Note the step gates below compare against the
      # STRING 'true' — env values are strings, and a bare non-empty
      # "false" is truthy in a step if.
      ABI_SELECTED: ${{ inputs.android_abis == '' || contains(format(',{0},', inputs.android_abis), format(',{0},', matrix.abi)) }}
    steps:
      - if: ${{ env.ABI_SELECTED == 'true' }}
        uses: actions/checkout@v4
      - if: ${{ env.ABI_SELECTED == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - if: ${{ env.ABI_SELECTED == 'true' }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - if: ${{ env.ABI_SELECTED == 'true' }}
        name: Install dependencies
        # eas build resolves app.json config plugins (expo-notifications,
        # expo-build-properties) LOCALLY before uploading to the cloud, so
        # node_modules must exist on the runner. v0.1.2 predates the
        # plugins block and got away without this; adding the plugins
        # made the leg fail in 40s without it.
        run: pnpm install --frozen-lockfile
      - name: Build with EAS
        if: ${{ env.ABI_SELECTED == 'true' }}
        env:
          # eas-cli authenticates with EXPO_TOKEN on CI (older releases read
          # EAS_TOKEN); set both from the same secret so it works across
          # eas-cli versions.
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: |
          cd apps/mobile
          # EAS compiles on Expo's cloud; the CLI uploads the project and
          # blocks until the build finishes. Capture this leg's build id so
          # the download step fetches ITS artifact — matrix legs run in
          # parallel, so `build:list --limit 1` would race between legs.
          npx -y eas-cli@24.8.0 build --platform android \
            --profile "${{ matrix.profile }}" --non-interactive 2>&1 | tee eas-build-output.log
          BID="$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' eas-build-output.log | head -1)"
          [ -n "$BID" ] || { echo "could not capture EAS build id" >&2; exit 1; }
          echo "BUILD_ID=$BID" >> "$GITHUB_ENV"
      - name: Download APK
        if: ${{ env.ABI_SELECTED == 'true' }}
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: |
          cd apps/mobile
          npx -y eas-cli@24.8.0 build:view "$BUILD_ID" --json > eas-build.json
          URL="$(node -p "(() => { const d = require('./eas-build.json'); const o = Array.isArray(d) ? d[0] : d; const u = Object.values(o.artifacts || {}).find((v) => typeof v === 'string' && v.startsWith('http')); return u || ''; })()")"
          [ -n "$URL" ] || { echo "no artifact URL found" >&2; cat eas-build.json; exit 1; }
          VER="$(node -p "require('./app.json').expo.version")"
          curl -fL -o "Nextdo_${VER}_android_${{ matrix.abi }}.apk" "$URL"
      - name: Upload bundle
        if: ${{ env.ABI_SELECTED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android-${{ matrix.abi }}
          path: apps/mobile/Nextdo_*_android_${{ matrix.abi }}.apk
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-macos, build-windows, build-linux, build-android]
    # Tag push: run only after every build succeeds. Manual dispatch: the
    # build jobs for the platforms NOT listed in build_targets are skipped,
    # so requiring all four would block the release forever — require only
    # the ones that actually ran, and run this job when none ran (pure
    # republish from run_id).
    if: >-
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (github.event_name == 'workflow_dispatch' ||
       contains(needs.*.result, 'success'))
    runs-on: ubuntu-latest
    steps:
      # gh release create shells out to git, so the workspace must be a
      # checkout.
      - uses: actions/checkout@v4
      # If a prior run_id is supplied, download its artifacts into bundles first
      # (e.g. reusing previously built macOS/Linux/Android artifacts).
      - name: Download artifacts from previous run
        if: ${{ inputs.run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: bundles
          merge-multiple: true
      # Download artifacts produced by the current run (if any were built).
      - name: Download artifacts from current run
        if: ${{ github.event_name == 'push' || inputs.build_targets != '' || inputs.run_id == '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          # A manual dispatch may reference a tag that does not exist yet —
          # create and push it (pointing at this run's commit).
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi
          # A tag carrying a semver prerelease suffix (v0.1.3-beta.1) means
          # the release must stay a prerelease, so it never shows up in the
          # "latest release" badge or the non-prerelease download list.
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE="--prerelease"
            KIND="Prerelease"
          else
            PRERELEASE=""
            KIND="Release"
          fi
          FILES=$(find bundles -type f | sort)
          echo "Found bundles to publish:"
          echo "$FILES"
          [ -n "$FILES" ] || { echo "No bundle files found in bundles directory!" >&2; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release already exists (e.g. this tag was re-run after a
            # pipeline fix) — just (re)upload the assets.
            gh release upload "$TAG" $FILES --clobber
            gh release edit "$TAG" $PRERELEASE
          else
            gh release create "$TAG" \
              --target "${{ github.sha }}" \
              $PRERELEASE \
              --title "Nextdo $TAG" \
              --notes "Nextdo $TAG — $KIND. Assets: $(cd bundles && find . -type f | sed 's#^\./##' | sort | paste -sd', ' -)." \
              $FILES
          fi
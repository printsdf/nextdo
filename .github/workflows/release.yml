# Nextdo desktop release pipeline.
#
# Triggered by pushing a version tag (v*) or manually via workflow_dispatch.
# Builds the Tauri desktop app on macOS / Windows / Linux (each CI job
# rebuilds the @nextdo/mobile web export via the tauri.conf.json
# beforeBuildCommand) and publishes one GitHub Release containing the
# installers for all three platforms.
#
# iOS / Android native builds are NOT part of this pipeline — they require
# store signing credentials (EAS / Fastlane) and are produced separately.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"
      run_id:
        description: "Build run that produced the artifacts to publish (GitHub run ID)"
        required: true
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  PNPM_VERSION: "12.5.1"
  NODE_VERSION: "22"

jobs:
  build-macos:
    name: Build macOS
    # Manual dispatch publishes artifacts from an existing build (run_id)
    # instead of rebuilding.
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build app bundle (arm64)
        run: pnpm --filter @nextdo/desktop exec tauri build --bundles app
      - name: Build app bundle (x64)
        run: |
          rustup target add x86_64-apple-darwin
          pnpm --filter @nextdo/desktop exec tauri build --bundles app --target x86_64-apple-darwin
      # Tauri's bundled create-dmg script uses the legacy `hdiutil create
      # -srcfolder` API which is broken on recent macOS (fails with
      # "no space left on device"). Build the installer with diskutil
      # instead — a plain (non-pretty) but fully functional dmg.
      - name: Package dmgs
        run: |
          VER="$(node -p "require('./apps/desktop/package.json').version")"
          package_dmg() {
            local OUT="$1" ARCH="$2" STAGE
            mkdir -p "$OUT/dmg"
            STAGE="$(mktemp -d)"
            cp -R "$OUT/macos/Nextdo.app" "$STAGE/"
            diskutil image create from "$STAGE" --volumeName Nextdo \
              --format UDZO "$OUT/dmg/Nextdo_${VER}_${ARCH}.dmg"
            rm -rf "$STAGE"
          }
          package_dmg "apps/desktop/src-tauri/target/release/bundle" aarch64
          package_dmg "apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle" x64
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build (nsis + msi)
        run: pnpm --filter @nextdo/desktop exec tauri build --bundles nsis,msi
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build (appimage + deb)
        run: pnpm --filter @nextdo/desktop exec tauri build --bundles appimage,deb
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-macos, build-windows, build-linux]
    # Tag push: run only after all builds succeed. Manual dispatch: build
    # jobs are skipped and artifacts come from the provided run_id.
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.build-macos.result == 'success' &&
        needs.build-windows.result == 'success' &&
        needs.build-linux.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      # gh release create shells out to git, so the workspace must be a
      # checkout.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.inputs.run_id }}
          path: bundles
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # A manual dispatch may reference a tag that does not exist yet —
          # create and push it (pointing at this run's commit).
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi
          FILES=$(find bundles -type f | sort)
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release already exists (e.g. this tag was re-run after a
            # pipeline fix) — just (re)upload the assets.
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" \
              --target "${{ github.sha }}" \
              --title "Nextdo $TAG" \
              --notes "Nextdo $TAG — desktop builds (macOS / Windows / Linux)." \
              $FILES
          fi
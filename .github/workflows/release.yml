# Nextdo desktop release pipeline.
#
# Triggered by pushing a version tag (v*) or manually via workflow_dispatch.
# Builds the Tauri desktop app on macOS / Windows / Linux (each CI job
# rebuilds the @nextdo/mobile web export via the tauri.conf.json
# beforeBuildCommand) and publishes one GitHub Release containing the
# installers for all three platforms.
#
# iOS / Android native builds are NOT part of this pipeline — they require
# store signing credentials (EAS / Fastlane) and are produced separately.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  PNPM_VERSION: "12.5.1"
  NODE_VERSION: "22"

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build app bundle
        run: pnpm --filter @nextdo/desktop exec tauri build --bundles app
      # Tauri's bundled create-dmg script uses the legacy `hdiutil create
      # -srcfolder` API which is broken on recent macOS (fails with
      # "no space left on device"). Build the installer with diskutil
      # instead — a plain (non-pretty) but fully functional dmg.
      - name: Package dmg
        run: |
          OUT=apps/desktop/src-tauri/target/release/bundle
          mkdir -p "$OUT/dmg"
          STAGE="$(mktemp -d)"
          cp -R "$OUT/macos/Nextdo.app" "$STAGE/"
          diskutil image create from "$STAGE" --volumeName Nextdo \
            --format UDZO "$OUT/dmg/Nextdo_0.1.0_aarch64.dmg"
          rm -rf "$STAGE"
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build (nsis + msi)
        run: pnpm --filter @nextdo/desktop exec tauri build --bundles nsis,msi
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build (appimage + deb)
        run: pnpm --filter @nextdo/desktop exec tauri build --bundles appimage,deb
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # workflow_dispatch may reference a tag that does not exist yet.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git tag -l "$TAG" | grep -qx "$TAG" || {
              git tag "$TAG"
              git push origin "$TAG"
            }
          fi
          gh release create "$TAG" \
            --target main \
            --title "Nextdo $TAG" \
            --notes "Nextdo $TAG — desktop builds (macOS / Windows / Linux)." \
            $(find bundles -type f | sort)

packages:
  - 'apps/*'
  - 'packages/*'
  - 'server/app'

# pnpm 10+ blocks build scripts by default; op-sqlite needs its native build
allowBuilds:
  '@op-engineering/op-sqlite': true
  esbuild: true
  workerd: true

minimumReleaseAgeExclude:
  - '@op-engineering/op-sqlite@18.2.5'

onlyBuiltDependencies:
  - '@op-engineering/op-sqlite'
  - esbuild
  - workerd
